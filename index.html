<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odds Against Life | Beta Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="reader-header">
        <div class="logo">ODDS AGAINST LIFE <span class="tag">BETA</span></div>
        <div class="progress-box">
            <span id="panel-counter">Panel 1 / 8</span>
            <div class="bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Odds Against Life</h1>
        <p>Интерактивная история о последствиях азартных игр.</p>
    </section>

    <section class="guide">
        <div class="step">
            <span class="step-num">01</span>
            <p>Листайте вниз для чтения</p>
        </div>
        <div class="step">
            <span class="step-num">02</span>
            <p>Следите за счетчиком сверху</p>
        </div>
        <div class="step">
            <span class="step-num">03</span>
            <p>Сделайте свой выбор</p>
        </div>
    </section>

    <main class="comic-container">
        <div class="panel"><img src="cover.jpg" alt="Обложка"></div>
        <div class="panel"><img src="page1.jpg" alt="Страница 1"></div>
        <div class="panel"><img src="page2.jpg" alt="Страница 2"></div>
        <div class="panel"><img src="page3.jpg" alt="Страница 3"></div>
        <div class="panel"><img src="page4.jpg" alt="Страница 4"></div>
        <div class="panel"><img src="page5.jpg" alt="Страница 5"></div>
        <div class="panel"><img src="page6.jpg" alt="Страница 6"></div>
        <div class="panel"><img src="page7.jpg" alt="Страница 7"></div>
    </main>

    <footer class="final-footer">
        <p>To be continued in Final Version...</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
